[project]
name = "deeptrace"
version = "0.1.0"
description = "Offline-first DeepTrace foundation"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = ["fastapi>=0.120,<1", "pydantic>=2.12,<3", "pydantic-settings>=2.11,<3", "uvicorn>=0.38,<1"]

[dependency-groups]
dev = ["pytest>=8.4", "httpx>=0.28", "ruff>=0.14", "mypy>=1.18"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
